[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-agent"
version = "0.1.0"
description = "A local agent that tidies messy download folders while you sleep"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nyx = "nyx.cli:main"

[tool.setuptools]
packages = ["nyx"]

[tool.setuptools.package-data]
nyx = ["web/*.html"]
